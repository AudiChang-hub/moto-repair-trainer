<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, sans-serif">
  <rect width="640" height="380" fill="#ffffff"/>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f2"/><stop offset=".45" stop-color="#dcdcd6"/><stop offset="1" stop-color="#9b9b94"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8f96"/><stop offset="1" stop-color="#4a4f56"/>
    </linearGradient>
  </defs>
  <text x="20" y="34" font-size="22" font-weight="700" fill="#222">普利珠(滾子)— 示意圖</text>
  <text x="20" y="58" font-size="14" fill="#666">外層是耐磨塑膠/尼龍,裡面包金屬;一組通常 6 顆,裝在前普利盤裡</text>

  <!-- 新品:圓柱形 3 顆 -->
  <g transform="translate(40,90)">
    <g>
      <rect x="0" y="20" width="90" height="70" rx="6" fill="url(#body)" stroke="#555" stroke-width="2"/>
      <ellipse cx="90" cy="55" rx="16" ry="35" fill="#e9e9e4" stroke="#555" stroke-width="2"/>
      <ellipse cx="90" cy="55" rx="8" ry="16" fill="url(#core)"/>
    </g>
    <g transform="translate(0,95)">
      <rect x="0" y="20" width="90" height="70" rx="6" fill="url(#body)" stroke="#555" stroke-width="2"/>
      <ellipse cx="90" cy="55" rx="16" ry="35" fill="#e9e9e4" stroke="#555" stroke-width="2"/>
      <ellipse cx="90" cy="55" rx="8" ry="16" fill="url(#core)"/>
    </g>
    <g transform="translate(120,48)">
      <ellipse cx="45" cy="55" rx="40" ry="40" fill="#e9e9e4" stroke="#555" stroke-width="2"/>
      <circle cx="45" cy="55" r="17" fill="url(#core)"/>
      <circle cx="45" cy="55" r="6" fill="#2d3136"/>
    </g>
    <text x="40" y="232" font-size="17" font-weight="700" fill="#2b8a3e">✔ 新品:正圓、表面平滑</text>
    <text x="40" y="254" font-size="13" fill="#555">側面是長方形,正面是圓形</text>
  </g>

  <!-- 中間箭頭 -->
  <g transform="translate(300,180)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#d9480f" stroke-width="4"/>
    <polygon points="50,-9 66,0 50,9" fill="#d9480f"/>
    <text x="-6" y="-16" font-size="13" fill="#d9480f">騎久了</text>
  </g>

  <!-- 磨損:扁平多邊形 -->
  <g transform="translate(400,120)">
    <polygon points="50,6 86,22 96,58 80,92 44,100 12,84 4,48 18,16" fill="#e9e9e4" stroke="#555" stroke-width="2"/>
    <line x1="18" y1="16" x2="50" y2="6" stroke="#b5b5ae" stroke-width="5"/>
    <line x1="96" y1="58" x2="80" y2="92" stroke="#b5b5ae" stroke-width="5"/>
    <circle cx="50" cy="53" r="17" fill="url(#core)"/>
    <circle cx="50" cy="53" r="6" fill="#2d3136"/>
    <polygon transform="translate(120,10)" points="40,8 72,18 84,50 70,80 38,88 10,74 4,40 16,14" fill="#e9e9e4" stroke="#555" stroke-width="2"/>
    <circle transform="translate(120,10)" cx="42" cy="48" r="15" fill="url(#core)"/>
    <text x="0" y="142" font-size="17" font-weight="700" fill="#c92a2a">✘ 磨損:被磨出平面、變扁</text>
    <text x="0" y="164" font-size="13" fill="#555">外徑變小 → 推不動普利盤</text>
    <text x="0" y="184" font-size="13" fill="#555">→ 加速悶、轉速高車速上不去</text>
  </g>
  <text x="20" y="366" font-size="12" fill="#888">本站繪製的示意圖,非實物照片。實物照片請點下方「看更多實物照片」。</text>
</svg>
